<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Hours Tracker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        max-width: 700px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .card {
        background: white;
        padding: 18px;
        margin-bottom: 18px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input, button {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        background: #222;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 15px;
    }

    button:hover {
        opacity: 0.85;
    }

    .period {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .entry {
        background: #f1f3f5;
        padding: 12px;
        border-radius: 10px;
        margin-top: 10px;
    }

    .total {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
    }

    .quote {
        font-style: italic;
        color: #555;
        margin-top: 5px;
    }

    .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin-top: 15px;
    }

    .day {
        padding: 10px 5px;
        text-align: center;
        border-radius: 8px;
        background: #eee;
    }

    .working {
        background: #9be7a5;
        font-weight: bold;
    }

    .weekday {
        font-weight: bold;
        text-align: center;
    }

    .delete {
        background: #d9534f;
        padding: 7px;
        margin-top: 8px;
        font-size: 13px;
    }

    @media (max-width: 500px) {
        .container {
            padding: 12px;
        }

        .period {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Work Hours Tracker</h1>

    <div class="card">
        <label>Date</label>
        <input type="date" id="date">

        <div class="period">
            <div>
                <label>Start Time</label>
                <input type="time" id="start">
            </div>

            <div>
                <label>End Time</label>
                <input type="time" id="end">
            </div>
        </div>

        <button onclick="addWork()">Add Work Hours</button>
    </div>

    <div class="card">
        <h2>Today's Information</h2>

        <div id="todayInfo">
            Select a date and add your working hours.
        </div>
    </div>

    <div class="card">
        <h2>Total Hours</h2>
        <div class="total" id="totalHours">0h 0m</div>
    </div>

    <div class="card">
        <h2>Work Calendar</h2>

        <label>Select Month</label>
        <input type="month" id="month" onchange="showCalendar()">

        <div class="calendar">
            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
        </div>

        <div id="calendar" class="calendar"></div>
    </div>

</div>

<script>

let workData = JSON.parse(localStorage.getItem("workData")) || {};

const quotes = [
    "Keep moving forward.",
    "Small steps become big results.",
    "Consistency creates progress.",
    "Your effort matters.",
    "Stay focused.",
    "Make today count.",
    "Keep building.",
    "Progress takes patience.",
    "One day at a time.",
    "Keep showing up.",
    "Hard work adds up.",
    "Believe in your progress.",
    "Stay strong.",
    "Keep going.",
    "You are getting closer.",
    "Focus on the goal.",
    "Do your best today.",
    "Discipline creates freedom.",
    "Every hour counts.",
    "Keep improving."
];

function getQuote(date) {

    let d = new Date(date);
    let index =
        (d.getFullYear() * 10000 +
        (d.getMonth() + 1) * 100 +
        d.getDate()) % quotes.length;

    return quotes[index];
}

function calculateHours(start, end) {

    let startParts = start.split(":");
    let endParts = end.split(":");

    let startMinutes =
        parseInt(startParts[0]) * 60 +
        parseInt(startParts[1]);

    let endMinutes =
        parseInt(endParts[0]) * 60 +
        parseInt(endParts[1]);

    // Night shift
    if (endMinutes <= startMinutes) {
        endMinutes += 24 * 60;
    }

    return endMinutes - startMinutes;
}

function formatMinutes(minutes) {

    let hours = Math.floor(minutes / 60);
    let mins = minutes % 60;

    return hours + "h " + mins + "m";
}

function addWork() {

    let date = document.getElementById("date").value;
    let start = document.getElementById("start").value;
    let end = document.getElementById("end").value;

    if (!date || !start || !end) {
        alert("Please enter the date, start time, and end time.");
        return;
    }

    if (!workData[date]) {
        workData[date] = [];
    }

    workData[date].push({
        start: start,
        end: end
    });

    localStorage.setItem("workData", JSON.stringify(workData));

    showToday(date);

    document.getElementById("start").value = "";
    document.getElementById("end").value = "";

    showCalendar();
    updateTotal();
}

function showToday(date) {

    let box = document.getElementById("todayInfo");

    if (!workData[date]) {

        box.innerHTML = `
            <strong>${date}</strong>
            <div class="quote">${getQuote(date)}</div>
        `;

        return;
    }

    let html = `
        <strong>${date}</strong>
        <div class="quote">"${getQuote(date)}"</div>
    `;

    let total = 0;

    workData[date].forEach((work, index) => {

        let minutes = calculateHours(work.start, work.end);
        total += minutes;

        html += `
            <div class="entry">
                <strong>${work.start} → ${work.end}</strong>
                <br>
                ${formatMinutes(minutes)}

                <button class="delete"
                    onclick="deleteWork('${date}', ${index})">
                    Delete
                </button>
            </div>
        `;
    });

    html += `
        <br>
        <strong>Daily Total: ${formatMinutes(total)}</strong>
    `;

    box.innerHTML = html;
}

function deleteWork(date, index) {

    workData[date].splice(index, 1);

    if (workData[date].length === 0) {
        delete workData[date];
    }

    localStorage.setItem("workData", JSON.stringify(workData));

    showToday(date);
    showCalendar();
    updateTotal();
}

function updateTotal() {

    let total = 0;

    Object.values(workData).forEach(day => {

        day.forEach(work => {
            total += calculateHours(work.start, work.end);
        });

    });

    document.getElementById("totalHours").innerText =
        formatMinutes(total);
}

function showCalendar() {

    let month = document.getElementById("month").value;

    if (!month) return;

    let [year, monthNumber] = month.split("-");

    year = parseInt(year);
    monthNumber = parseInt(monthNumber);

    let firstDay =
        new Date(year, monthNumber - 1, 1).getDay();

    let daysInMonth =
        new Date(year, monthNumber, 0).getDate();

    let calendar = document.getElementById("calendar");

    calendar.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {

        let blank = document.createElement("div");
        calendar.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {

        let date =
            year + "-" +
            String(monthNumber).padStart(2, "0") + "-" +
            String(day).padStart(2, "0");

        let div = document.createElement("div");

        div.className = "day";

        if (workData[date]) {
            div.classList.add("working");
        }

        div.innerText = day;

        div.onclick = function() {

            document.getElementById("date").value = date;
            showToday(date);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };

        calendar.appendChild(div);
    }
}

document.getElementById("date").addEventListener("change", function() {
    showToday(this.value);
});

let today = new Date();

let todayString =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");

document.getElementById("date").value = todayString;

document.getElementById("month").value =
    todayString.substring(0, 7);

showToday(todayString);
showCalendar();
updateTotal();

</script>

</body>
</html>

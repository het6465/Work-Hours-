<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Hours Tracker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#18202a;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 40px;
}

h1{
  margin:0 0 6px;
  font-size:28px;
}

.sub{
  color:#65717e;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border:1px solid #dfe4e8;
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:10px;
  align-items:end;
}

label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #cbd3da;
  border-radius:8px;
  font-size:16px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  background:#1f2937;
  color:white;
}

.secondary{
  background:#e9edf1;
  color:#202832;
}

.danger{
  background:#b42318!important;
}

.green{
  background:#16803c!important;
}

.msg{
  min-height:20px;
  color:#b42318;
  font-size:14px;
  margin-top:8px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f7f9fa;
  border-radius:10px;
  padding:14px;
}

.stat span{
  display:block;
  color:#687581;
  font-size:13px;
}

.stat strong{
  font-size:22px;
  display:block;
  margin-top:4px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.month{
  font-weight:700;
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  text-align:left;
  padding:10px 7px;
  border-bottom:1px solid #e6eaed;
}

th{
  font-size:13px;
  color:#66727e;
}

.right{
  text-align:right;
}

.empty{
  text-align:center;
  color:#74808b;
  padding:25px;
}

/* CALENDAR */

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.calendar-title{
  font-size:19px;
  font-weight:700;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.calendar-weekday{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  color:#687581;
  padding:6px 0;
}

.calendar-day{
  min-height:58px;
  border:1px solid #e1e6ea;
  border-radius:8px;
  background:#fafbfc;
  padding:7px;
  cursor:pointer;
}

.calendar-day:hover{
  border-color:#9aa6b2;
}

.calendar-day.empty-day{
  background:transparent;
  border:0;
  cursor:default;
}

.calendar-day.today{
  border:2px solid #1f2937;
}

.calendar-day.worked{
  background:#dff5e7;
  border-color:#63bd7b;
}

.calendar-number{
  font-weight:700;
}

.calendar-hours{
  font-size:11px;
  margin-top:6px;
  color:#236b38;
  font-weight:700;
}

.day-details{
  margin-top:15px;
  background:#f7f9fa;
  border-radius:10px;
  padding:14px;
}

.period{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #dde3e7;
}

.period:last-child{
  border-bottom:0;
}

.period-buttons{
  display:flex;
  gap:5px;
}

.period-buttons button{
  padding:6px 9px;
  font-size:12px;
}

.total-day{
  margin-top:12px;
  font-weight:700;
}

@media(max-width:700px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .form button{
    grid-column:1/-1;
  }

  .summary{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .calendar-day{
    min-height:52px;
    padding:5px;
  }

  .calendar-hours{
    font-size:10px;
  }

  .period{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

<div class="container">

<h1>Work Hours Tracker</h1>
<div class="sub">
Track multiple work periods every day and see your monthly total.
</div>

<!-- ADD WORK PERIOD -->

<div class="card">

<form id="workForm">

<div class="form">

<div>
<label for="date">Date</label>
<input id="date" type="date" required>
</div>

<div>
<label for="start">Start time</label>
<input id="start" type="time" required>
</div>

<div>
<label for="end">End time</label>
<input id="end" type="time" required>
</div>

<button type="submit">Add Work Period</button>

</div>

<div class="msg" id="msg"></div>

</form>

</div>


<!-- SUMMARY -->

<div class="card">

<div class="summary">

<div class="stat">
<span>Selected month</span>
<strong id="monthName">—</strong>
</div>

<div class="stat">
<span>Days worked</span>
<strong id="days">0</strong>
</div>

<div class="stat">
<span>Total hours</span>
<strong id="total">0h 00m</strong>
</div>

</div>

</div>


<!-- DAILY RECORDS -->

<div class="card">

<div class="toolbar">

<div class="month">
Daily Records
</div>

<input id="monthPicker" type="month">

</div>

<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>Date</th>
<th>Work Periods</th>
<th class="right">Total</th>
<th class="right">Action</th>
</tr>

</thead>

<tbody id="records"></tbody>

</table>

</div>

</div>


<!-- CALENDAR -->

<div class="card">

<div class="calendar-header">

<div class="calendar-title">
Work Calendar
</div>

<div>
<button type="button" id="prevMonth" class="secondary">‹</button>
<button type="button" id="nextMonth" class="secondary">›</button>
</div>

</div>

<div id="calendar"></div>

<div id="dayDetails"></div>

</div>


<!-- CLEAR -->

<div class="card">

<button class="danger" id="clearAll" type="button">
Clear All Records
</button>

</div>

</div>


<script>

(function(){

const KEY="work_hours_tracker_records_v2";

const $=id=>document.getElementById(id);

let records=JSON.parse(localStorage.getItem(KEY)||"{}");


function today(){

const d=new Date();

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}


function monthNow(){

return today().slice(0,7);

}


$("date").value=today();

$("monthPicker").value=monthNow();


/* TIME CALCULATION */

function minutes(start,end){

const [sh,sm]=start.split(":").map(Number);

const [eh,em]=end.split(":").map(Number);

let a=sh*60+sm;

let b=eh*60+em;

if(b<a)b+=1440;

return b-a;

}


function hm(m){

return Math.floor(m/60)+"h "+
String(m%60).padStart(2,"0")+"m";

}


function niceDate(s){

const [y,m,d]=s.split("-").map(Number);

return new Date(
Date.UTC(y,m-1,d)
).toLocaleDateString(undefined,{
month:"short",
day:"numeric",
year:"numeric",
timeZone:"UTC"
});

}


function save(){

localStorage.setItem(KEY,JSON.stringify(records));

}


/* GET ALL PERIODS FOR A DAY */

function getPeriods(date){

if(!records[date]){

records[date]=[];

}

return records[date];

}


/* TOTAL FOR DAY */

function dayTotal(date){

return getPeriods(date)
.reduce((sum,p)=>sum+p.minutes,0);

}


/* ADD WORK PERIOD */

$("workForm").addEventListener("submit",function(e){

e.preventDefault();

const date=$("date").value;

const start=$("start").value;

const end=$("end").value;

if(!date||!start||!end){

$("msg").textContent=
"Please enter date, start time, and end time.";

return;

}

const mins=minutes(start,end);

if(mins<=0||mins>1440){

$("msg").textContent=
"Please enter valid working times.";

return;

}


/* Create array if day doesn't exist */

if(!records[date]){

records[date]=[];

}


/* Add another period instead of replacing */

records[date].push({

start:start,

end:end,

minutes:mins

});


save();

$("monthPicker").value=date.slice(0,7);

$("msg").textContent=
"Work period added!";

$("start").value="";

$("end").value="";

render();

renderCalendar();

});


/* RENDER DAILY TABLE */

function render(){

const mo=$("monthPicker").value||monthNow();

const list=Object.keys(records)

.filter(date=>date.slice(0,7)===mo)

.filter(date=>records[date].length>0)

.sort();


let total=0;

list.forEach(date=>{

total+=dayTotal(date);

});


const [y,m]=mo.split("-").map(Number);


$("monthName").textContent=

new Date(Date.UTC(y,m-1,1))

.toLocaleDateString(undefined,{

month:"long",

year:"numeric",

timeZone:"UTC"

});


$("days").textContent=list.length;

$("total").textContent=hm(total);


const body=$("records");


if(!list.length){

body.innerHTML=

'<tr><td colspan="4" class="empty">'+
'No work records for this month.'+
'</td></tr>';

return;

}


body.innerHTML=list.map(date=>{

const periods=records[date];

const periodText=periods.map(p=>
p.start+" – "+p.end
).join("<br>");

return `

<tr>

<td>${niceDate(date)}</td>

<td>${periodText}</td>

<td class="right">${hm(dayTotal(date))}</td>

<td class="right">

<button
class="secondary"
type="button"
onclick="showDay('${date}')">

View

</button>

</td>

</tr>

`;

}).join("");

}


/* CALENDAR */

function renderCalendar(){

const mo=$("monthPicker").value||monthNow();

const [year,month]=mo.split("-").map(Number);

const firstDay=new Date(
Date.UTC(year,month-1,1)
).getUTCDay();

const daysInMonth=new Date(
Date.UTC(year,month,0)
).getUTCDate();


let html="";

html+=`

<div class="calendar-grid">

<div class="calendar-weekday">Sun</div>
<div class="calendar-weekday">Mon</div>
<div class="calendar-weekday">Tue</div>
<div class="calendar-weekday">Wed</div>
<div class="calendar-weekday">Thu</div>
<div class="calendar-weekday">Fri</div>
<div class="calendar-weekday">Sat</div>

`;


/* Empty spaces before first day */

for(let i=0;i<firstDay;i++){

html+=`<div class="calendar-day empty-day"></div>`;

}


/* Days */

for(let day=1;day<=daysInMonth;day++){

const date=

year+"-"+

String(month).padStart(2,"0")+"-"+

String(day).padStart(2,"0");


const worked=
records[date] &&
records[date].length>0;


const isToday=date===today();


html+=`

<div

class="calendar-day
${worked?"worked":""}
${isToday?"today":""}"

onclick="showDay('${date}')"

>

<div class="calendar-number">
${day}
</div>

${worked?

`<div class="calendar-hours">
${hm(dayTotal(date))}
</div>`

:""}

</div>

`;

}


html+="</div>";

$("calendar").innerHTML=html;

}


/* SHOW DAY DETAILS */

window.showDay=function(date){

const periods=records[date]||[];

if(!periods.length){

$("dayDetails").innerHTML=`

<div class="day-details">

<strong>${niceDate(date)}</strong>

<p>No work recorded for this day.</p>

</div>

`;

return;

}


let html=`

<div class="day-details">

<strong>${niceDate(date)}</strong>

`;

periods.forEach((p,index)=>{

html+=`

<div class="period">

<div>

<strong>Period ${index+1}</strong><br>

${p.start} – ${p.end}

<br>

<small>${hm(p.minutes)}</small>

</div>

<div class="period-buttons">

<button

class="secondary"

onclick="editPeriod('${date}',${index})">

Edit

</button>

<button

class="danger"

onclick="deletePeriod('${date}',${index})">

Delete

</button>

</div>

</div>

`;

});


html+=`

<div class="total-day">

Day total: ${hm(dayTotal(date))}

</div>

</div>

`;

$("dayDetails").innerHTML=html;

};


/* EDIT PERIOD */

window.editPeriod=function(date,index){

const p=records[date][index];

$("date").value=date;

$("start").value=p.start;

$("end").value=p.end;


/* Remove old period */

records[date].splice(index,1);

if(records[date].length===0){

delete records[date];

}

save();

render();

renderCalendar();

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* DELETE PERIOD */

window.deletePeriod=function(date,index){

records[date].splice(index,1);

if(records[date].length===0){

delete records[date];

}

save();

render();

renderCalendar();

$("dayDetails").innerHTML="";

};


/* MONTH CHANGE */

$("monthPicker").addEventListener("change",function(){

render();

renderCalendar();

$("dayDetails").innerHTML="";

});


/* PREVIOUS MONTH */

$("prevMonth").addEventListener("click",function(){

const [y,m]=$("monthPicker").value.split("-").map(Number);

const d=new Date(Date.UTC(y,m-2,1));

$("monthPicker").value=

d.getUTCFullYear()+"-"+

String(d.getUTCMonth()+1).padStart(2,"0");

render();

renderCalendar();

$("dayDetails").innerHTML="";

});


/* NEXT MONTH */

$("nextMonth").addEventListener("click",function(){

const [y,m]=$("monthPicker").value.split("-").map(Number);

const d=new Date(Date.UTC(y,m,1));

$("monthPicker").value=

d.getUTCFullYear()+"-"+

String(d.getUTCMonth()+1).padStart(2,"0");

render();

renderCalendar();

$("dayDetails").innerHTML="";

});


/* CLEAR EVERYTHING */

$("clearAll").addEventListener("click",function(){

if(confirm("Delete ALL saved work records?")){

records={};

save();

render();

renderCalendar();

$("dayDetails").innerHTML="";

}

});


/* INITIAL DISPLAY */

render();

renderCalendar();


})();


/* SERVICE WORKER */

if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker.register("./sw.js")
.catch(function(){});

});

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Hours</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#18202a}
.container{max-width:850px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 6px;font-size:28px}.sub{color:#65717e;margin-bottom:22px}
.card{background:#fff;border:1px solid #dfe4e8;border-radius:14px;padding:18px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input{width:100%;padding:11px;border:1px solid #cbd3da;border-radius:8px;font-size:16px}
button{border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:#1f2937;color:#fff}
button.secondary{background:#e9edf1;color:#202832}.danger{background:#b42318!important}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#f7f9fa;border-radius:10px;padding:14px}.stat span{display:block;color:#687581;font-size:13px}.stat strong{font-size:23px;display:block;margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.month{font-weight:700;font-size:18px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e6eaed}th{font-size:13px;color:#66727e}
.right{text-align:right} .empty{text-align:center;color:#74808b;padding:25px}
.msg{min-height:20px;color:#b42318;font-size:14px;margin-top:8px}
@media(max-width:650px){.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}.summary{grid-template-columns:1fr}.container{padding:18px 12px}table{font-size:14px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="container">
  <h1>Work Hours Tracker</h1>
  <div class="sub">Track your daily working hours and see your monthly total.</div>

  <div class="card">
    <form id="workForm">
      <div class="form">
        <div><label for="date">Date</label><input id="date" type="date" required></div>
        <div><label for="start">Start time</label><input id="start" type="time" required></div>
        <div><label for="end">End time</label><input id="end" type="time" required></div>
        <button type="submit">Add / Update Day</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="card">
    <div class="summary">
      <div class="stat"><span>Selected month</span><strong id="monthName">—</strong></div>
      <div class="stat"><span>Days worked</span><strong id="days">0</strong></div>
      <div class="stat"><span>Total hours</span><strong id="total">0h 00m</strong></div>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="month">Daily records</div>
      <input id="monthPicker" type="month" style="max-width:190px">
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Date</th><th>Start</th><th>End</th><th class="right">Hours</th><th class="right">Action</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <button class="danger" id="clearAll" type="button">Clear All Records</button>
  </div>
</div>

<script>
(function(){
  const KEY="work_hours_tracker_records_v1";
  const $=id=>document.getElementById(id);
  let records=JSON.parse(localStorage.getItem(KEY)||"{}");

  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function monthNow(){return today().slice(0,7)}
  $("date").value=today();
  $("monthPicker").value=monthNow();

  function minutes(start,end){
    const [sh,sm]=start.split(":").map(Number), [eh,em]=end.split(":").map(Number);
    let a=sh*60+sm,b=eh*60+em;
    if(b<a)b+=1440; // supports an overnight shift
    return b-a;
  }
  function hm(m){
    return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
  }
  function niceDate(s){
    const [y,m,d]=s.split("-").map(Number);
    return new Date(Date.UTC(y,m-1,d)).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(records));}
  function render(){
    const mo=$("monthPicker").value||monthNow();
    const list=Object.entries(records)
      .filter(([date])=>date.slice(0,7)===mo)
      .sort(([a],[b])=>a.localeCompare(b));
    let total=0;
    list.forEach(([,r])=>total+=r.minutes);
    const [y,m]=mo.split("-").map(Number);
    $("monthName").textContent=new Date(Date.UTC(y,m-1,1)).toLocaleDateString(undefined,{month:"long",year:"numeric",timeZone:"UTC"});
    $("days").textContent=list.length;
    $("total").textContent=hm(total);
    const body=$("records");
    if(!list.length){body.innerHTML='<tr><td colspan="5" class="empty">No work records for this month.</td></tr>';return;}
    body.innerHTML=list.map(([date,r])=>`
      <tr>
        <td>${niceDate(date)}</td><td>${r.start}</td><td>${r.end}</td>
        <td class="right">${hm(r.minutes)}</td>
        <td class="right"><button class="secondary edit" data-date="${date}" type="button">Edit</button>
        <button class="danger delete" data-date="${date}" type="button">Delete</button></td>
      </tr>`).join("");
    document.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>{
      const r=records[b.dataset.date]; $("date").value=b.dataset.date;$("start").value=r.start;$("end").value=r.end;
      window.scrollTo({top:0,behavior:"smooth"});
    }));
    document.querySelectorAll(".delete").forEach(b=>b.addEventListener("click",()=>{
      delete records[b.dataset.date];save();render();
    }));
  }
  $("workForm").addEventListener("submit",e=>{
    e.preventDefault();
    const date=$("date").value,start=$("start").value,end=$("end").value;
    if(!date||!start||!end){$("msg").textContent="Please enter a date, start time, and end time.";return;}
    const mins=minutes(start,end);
    if(mins<=0||mins>1440){$("msg").textContent="Please enter valid working times.";return;}
    records[date]={start,end,minutes:mins};save();
    $("monthPicker").value=date.slice(0,7);$("msg").textContent="";
    render();
  });
  $("monthPicker").addEventListener("change",render);
  $("clearAll").addEventListener("click",()=>{
    if(confirm("Delete all saved work records?")){records={};save();render();}
  });
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
